name: Publish to npm

# Runs when a GitHub release is published (or by hand). Uses npm trusted publishing (OIDC):
# no NPM_TOKEN secret, and npm attaches a provenance statement to every version.
# Configure once on npmjs.com: package Settings → Trusted Publisher → GitHub Actions,
# owner SaadNiaziDev, repository bento-shad-ui, workflow publish.yml.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing (11.5+)
        run: npm install -g npm@latest

      - id: version
        name: Read version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release tag matches package.json
        if: github.event_name == 'release'
        run: |
          if [ "${{ github.event.release.tag_name }}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match package.json version v${{ steps.version.outputs.version }}"
            exit 1
          fi

      - id: exists
        name: Skip if this version is already on npm
        run: |
          if npm view "bento-shad-ui@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "bento-shad-ui@${{ steps.version.outputs.version }} is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.published == 'false'
        run: npm ci

      - name: Generated files are committed and up to date
        if: steps.exists.outputs.published == 'false'
        run: npm run build && git diff --exit-code -- dist r llms-full.txt

      - name: Publish (prepublishOnly runs typecheck, build, tests and docs)
        if: steps.exists.outputs.published == 'false'
        run: npm publish --provenance --access public
