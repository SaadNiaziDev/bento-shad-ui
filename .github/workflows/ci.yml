name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Generated files are committed and up to date
        run: git diff --exit-code -- dist r llms-full.txt
      - run: npm test
      - name: Docs site builds (links, props tables, previews)
        run: npm run docs
